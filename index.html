
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Krista's Interactive Classroom</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#player {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

iframe {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1088px;
  height: 720px;
  border: none;
  transform-origin: center center;
}
</style>
</head>

<body>

<div id="player">
  <iframe
    id="lumi"
    src="https://app.lumi.education/api/v1/run/vbmriI/embed"
    width="1088"
    height="720"
    allowfullscreen
    allow="geolocation *; microphone *; camera *; midi *; encrypted-media *">
  </iframe>
</div>

<script>
const frame = document.getElementById("lumi");

function fitVideo() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  if (h > w) {
    const scaleX = (h / 1088) * 1.04;
    const scaleY = (w / 720) * 1.04;

    frame.style.transform =
      `translate(-50%, -50%) rotate(90deg) scale(${scaleX}, ${scaleY})`;
  } else {
    const scaleX = (w / 1088) * 1.04;
    const scaleY = (h / 720) * 1.04;

    frame.style.transform =
      `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
  }
}

window.addEventListener("resize", fitVideo);
window.addEventListener("orientationchange", fitVideo);

fitVideo();
</script>
</body>
</html>
