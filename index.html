
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Krista's Interactive Classroom</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#player {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #000;
}

iframe {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1088px;
  height: 720px;
  border: 0;
  transform: translate(-50%, -50%);
}

/* Mobile only */
@media (max-width: 768px) {
  iframe {
    transform-origin: center center;
  }
}
</style>
</head>

<body>

<div id="player">
  <iframe
    id="lumi"
    src="https://app.lumi.education/api/v1/run/vbmriI/embed"
    width="1088"
    height="720"
    allowfullscreen
    allow="geolocation *; microphone *; camera *; midi *; encrypted-media *">
  </iframe>
</div>

<script>
const frame = document.getElementById("lumi");

function fitVideo() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Desktop: preserve original dimensions
  if (window.matchMedia("(min-width: 769px)").matches) {
    frame.style.transform =
      "translate(-50%, -50%)";
    return;
  }

  // Mobile: slightly enlarge to reduce black gaps
  const zoom = 1.08;

  if (h > w) {
    const scale = Math.min(h / 1088, w / 720) * zoom;

    frame.style.transform =
      `translate(-50%, -50%) rotate(90deg) scale(${scale})`;
  } else {
    const scale = Math.min(w / 1088, h / 720) * zoom;

    frame.style.transform =
      `translate(-50%, -50%) scale(${scale})`;
  }
}

window.addEventListener("resize", fitVideo);
window.addEventListener("orientationchange", fitVideo);

fitVideo();
</script>

<script src="https://app.lumi.education/api/v1/h5p/core/js/h5p-resizer.js"
        charset="UTF-8"></script>

</body>
</html>
