
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krista's Interactive Classroom</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#player {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #000;
}

iframe {
  display: block;
  width: 1088px;
  height: 720px;
  border: 0;
}

/* Mobile: landscape phone */
@media (pointer: coarse) and (orientation: landscape) {
  iframe {
    width: min(100vw, calc(100dvh * 1.5111)) !important;
    height: min(100dvh, calc(100vw / 1.5111)) !important;
  }
}

/* Mobile: portrait phone — rotate the video */
@media (pointer: coarse) and (orientation: portrait) {
  iframe {
    position: absolute;
    width: min(100dvh, calc(100vw * 1.5111)) !important;
    height: min(100vw, calc(100dvh / 1.5111)) !important;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
  }
}
</style>
</head>

<body>
<div id="player">
  <iframe
    src="https://app.lumi.education/api/v1/run/vbmriI/embed"
    width="1088"
    height="720"
    frameborder="0"
    allowfullscreen
    allow="geolocation *; microphone *; camera *; midi *; encrypted-media *">
  </iframe>
</div>

<script src="https://app.lumi.education/api/v1/h5p/core/js/h5p-resizer.js"
        charset="UTF-8"></script>
</body>
</html>
